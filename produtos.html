<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Preços | JS Produtos de Limpeza</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="data.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const WA_NUMBER = "5535999481582";

    function App() {
      const [filterCategory, setFilterCategory] = useState("Todos");
      const [cart, setCart] = useState({});
      const categories = ["Todos", "Líquidos", "Roupas", "Sabões", "Acessórios", "Utensílios", "Kits"];

      const itemsToShow = filterCategory === "Kits" 
        ? KITS 
        : (filterCategory === "Todos" ? [...CATALOG, ...KITS] : CATALOG.filter(p => p.category === filterCategory));

      const addToCart = (id) => setCart(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
      const removeFromCart = (id) => setCart(prev => {
        const updated = { ...prev };
        if (updated[id] > 1) updated[id] -= 1;
        else delete updated[id];
        return updated;
      });

      const totalItemsCount = Object.values(cart).reduce((a, b) => a + b, 0);

      const sendWhatsAppOrder = () => {
        let msg = "Olá! Gostaria de fazer este pedido:%0A%0A";
        let subtotal = 0;

        CATALOG.forEach(p => {
          if (cart[p.id]) {
            const itemTotal = cart[p.id] * p.price;
            subtotal += itemTotal;
            msg += `• ${cart[p.id]}x ${p.name} - R$ ${itemTotal.toFixed(2).replace('.', ',')}%0A`;
          }
        });
        
        KITS.forEach(k => {
          if (cart[k.id]) {
            const kitTotal = cart[k.id] * (k.price * (1 - k.discount));
            subtotal += kitTotal;
            msg += `• ${cart[k.id]}x ${k.name} (c/ ${k.discount * 100}% desc) - R$ ${kitTotal.toFixed(2).replace('.', ',')}%0A`;
          }
        });

        msg += `%0A*Total final:* R$ ${subtotal.toFixed(2).replace('.', ',')}`;
        window.open(`https://wa.me/${WA_NUMBER}?text=${msg}`, '_blank');
      };

      return (
        <div className="max-w-2xl mx-auto py-8 px-4">
          <h1 className="text-2xl font-serif font-bold text-center mb-8">Catálogo JS</h1>
          <div className="flex flex-wrap justify-center gap-2 mb-8">
            {categories.map(cat => (
              <button key={cat} onClick={() => setFilterCategory(cat)} 
                className={`px-4 py-2 rounded-full text-xs font-bold ${filterCategory === cat ? 'bg-slate-900 text-white' : 'bg-white border'}`}>
                {cat}
              </button>
            ))}
          </div>

          <div className="bg-white rounded-xl shadow-sm border divide-y">
            {itemsToShow.map(item => {
              const qty = cart[item.id] || 0;
              return (
                <div key={item.id} className="py-4 px-4 flex justify-between items-center">
                  <div>
                    <p className="font-bold">{item.name}</p>
                    <p className="text-xs text-slate-500">{item.category}</p>
                  </div>
                  <div className="flex items-center gap-4">
                    <span className="font-bold text-emerald-700">R$ {item.price.toFixed(2).replace('.', ',')}</span>
                    {qty === 0 ? (
                      <button onClick={() => addToCart(item.id)} className="bg-slate-900 text-white px-3 py-1 rounded-lg text-xs">Adicionar</button>
                    ) : (
                      <div className="flex items-center gap-2 border px-2 py-1 rounded-lg">
                        <button onClick={() => removeFromCart(item.id)}>-</button>
                        <span>{qty}</span>
                        <button onClick={() => addToCart(item.id)}>+</button>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
          {totalItemsCount > 0 && (
            <button onClick={sendWhatsAppOrder} className="fixed bottom-4 left-4 right-4 bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg">
              Finalizar Pedido
            </button>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
