<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Preços | JS Produtos de Limpeza</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="data.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const WA_NUMBER = "5535999481582";

    function ProductIcon({ type }) {
      const iconClass = "w-4 h-4 text-sky-600";
      
      switch (type) {
        case 'bottle':
          return (
            <svg className={iconClass} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
          );
        case 'cloth':
          return (
            <svg className={iconClass} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          );
        case 'clip':
          return (
            <svg className={iconClass} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
            </svg>
          );
        case 'sponge':
          return (
            <svg className={iconClass} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
          );
        case 'broom':
        case 'squeegee':
        case 'dustpan':
          return (
            <svg className={iconClass} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 5H9L8 4z" />
            </svg>
          );
        case 'soap':
          return (
            <svg className={iconClass} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 12H4V8a2 2 0 012-2h12a2 2 0 012 2v4zM4 12v4a2 2 0 002 2h12a2 2 0 002-2v-4" />
            </svg>
          );
        case 'shirt':
          return (
            <svg className={iconClass} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 4l4 4-2 2-2-2v12H8V8l-2 2-2-2 4-4h8z" />
            </svg>
          );
        default:
          return (
            <svg className={iconClass} fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
            </svg>
          );
      }
    }

    function App() {
      const [filterCategory, setFilterCategory] = useState("Todos");
      const [cart, setCart] = useState({});

      const categories = ["Todos", "Líquidos", "Roupas", "Sabões", "Acessórios", "Utensílios"];

      const filteredProducts = filterCategory === "Todos" 
        ? CATALOG 
        : CATALOG.filter(p => p.category === filterCategory);

      const addToCart = (id) => {
        setCart(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
      };

      const removeFromCart = (id) => {
        setCart(prev => {
          const updated = { ...prev };
          if (updated[id] > 1) {
            updated[id] -= 1;
          } else {
            delete updated[id];
          }
          return updated;
        });
      };

      const totalItemsCount = Object.values(cart).reduce((a, b) => a + b, 0);

      const sendWhatsAppOrder = () => {
        let msg = "Olá! Gostaria de fazer o seguinte pedido:%0A%0A";
        let subtotal = 0;

        CATALOG.forEach(p => {
          if (cart[p.id]) {
            const qtd = cart[p.id];
            const itemTotal = qtd * p.price;
            subtotal += itemTotal;
            msg += `• ${qtd}x ${p.name} - R$ ${itemTotal.toFixed(2).replace('.', ',')}%0A`;
          }
        });

        msg += `%0A*Total estimado:* R$ ${subtotal.toFixed(2).replace('.', ',')}`;
        window.open(`https://wa.me/${WA_NUMBER}?text=${msg}`, '_blank');
      };

      return (
        <div className="min-h-screen flex flex-col pb-28">
          
          {/* Header Superior */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-2xl mx-auto px-6 py-4 flex items-center justify-between">
              <a href="index.html" className="text-xs font-semibold text-slate-500 hover:text-slate-800 flex items-center gap-1 transition">
                ← Voltar para o incio
              </a>
              <h1 className="font-serif font-bold text-sm text-slate-900">JS Produtos de Limpeza</h1>
              <span className="text-[11px] font-semibold bg-sky-50 text-sky-800 px-3 py-1 rounded-full border border-sky-100">
                Extrema - MG
              </span>
            </div>
          </header>

          {/* Conteúdo Principal */}
          <main className="max-w-2xl mx-auto px-4 sm:px-6 py-8 flex-grow w-full">
            <div className="text-center mb-8">
              <span className="text-sky-700 font-semibold text-[11px] uppercase tracking-widest bg-sky-50 px-3 py-1 rounded-full border border-sky-100">
                CATÁLOGO DE PREÇOS
              </span>
              <h2 className="text-2xl sm:text-3xl font-serif text-slate-900 mt-3">Tabela de Produtos</h2>
              
              {/* Filtros */}
              <div className="flex flex-wrap justify-center gap-2 mt-5">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setFilterCategory(cat)}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition ${
                      filterCategory === cat 
                        ? 'bg-slate-900 text-white shadow-sm' 
                        : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
            </div>

            {/* Lista Estilo Flyer */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden divide-y divide-slate-100">
              {filteredProducts.map(prod => {
                const qty = cart[prod.id] || 0;
                return (
                  <div key={prod.id} className="py-3 px-4 sm:px-5 flex items-center justify-between gap-3 hover:bg-slate-50 transition">
                    
                    {/* Ícone circular esquerdo + Nome e unidade */}
                    <div className="flex items-center gap-3.5 min-w-0 flex-grow">
                      <div className="w-8 h-8 rounded-full bg-sky-50 border border-sky-100 flex items-center justify-center shrink-0">
                        <ProductIcon type={prod.icon} />
                      </div>
                      <div className="min-w-0 flex-grow flex items-baseline gap-2">
                        <span className="font-semibold text-slate-900 text-xs sm:text-sm truncate">{prod.name}</span>
                        <span className="text-[11px] text-slate-400 shrink-0">({prod.unit})</span>
                      </div>
                    </div>

                    {/* Preço e Botão */}
                    <div className="flex items-center gap-4 shrink-0">
                      <span className="text-xs sm:text-sm font-extrabold text-emerald-700 w-24 text-right">
                        R$ {prod.price.toFixed(2).replace('.', ',')}
                      </span>

                      {qty === 0 ? (
                        <button 
                          onClick={() => addToCart(prod.id)}
                          className="bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-semibold px-3 py-1.5 rounded-lg transition shadow-xs"
                        >
                          Adicionar
                        </button>
                      ) : (
                        <div className="flex items-center gap-2 bg-slate-100 px-2 py-1 rounded-lg border border-slate-200">
                          <button onClick={() => removeFromCart(prod.id)} className="font-bold text-slate-600 hover:text-red-600 text-xs px-1">-</button>
                          <span className="text-xs font-bold text-slate-900">{qty}</span>
                          <button onClick={() => addToCart(prod.id)} className="font-bold text-slate-600 hover:text-emerald-600 text-xs px-1">+</button>
                        </div>
                      )}
                    </div>

                  </div>
                );
              })}
            </div>
          </main>

          {/* Carrinho Fixo Rodapé */}
          {totalItemsCount > 0 && (
            <div className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-xl py-4 px-6 z-40">
              <div className="max-w-2xl mx-auto flex items-center justify-between gap-4">
                <div>
                  <p className="text-[11px] text-slate-500 font-medium">Itens selecionados:</p>
                  <p className="text-sm font-bold text-slate-900">{totalItemsCount} {totalItemsCount === 1 ? 'item' : 'itens'}</p>
                </div>
                <button 
                  onClick={sendWhatsAppOrder}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-5 rounded-xl shadow-md transition text-xs flex items-center gap-2"
                >
                  <span>FAÇA JÁ SEU PEDIDO!</span>
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
